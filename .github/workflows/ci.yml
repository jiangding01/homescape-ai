name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Raster geometry smoke
        run: pnpm floorplan:raster:check-demo

      - name: Benchmark smoke
        run: pnpm floorplan:benchmark:check-demo

      - name: Pilot evaluation smoke
        run: pnpm floorplan:pilot:check-demo

      - name: Raster pilot batch smoke
        run: pnpm floorplan:raster:batch:check-demo
